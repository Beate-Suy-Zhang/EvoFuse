# Hyperparameters used by dra_sds_main.py.
# Paths remain relative to the project root to preserve the original behavior.

experiment:
  datasets:
    - M3FD
    # - MSOD
    - FMB
    # - MFNet
    - VT821
    # - VT1000
    # - VT5000
  iterations: 5
  initial_fusion_checkpoint: ckpt/evofuse.pth

evolutionary_learning:
  epochs_per_task: 5
  initial_learning_rate: 2.0e-4
  num_generations: 5
  num_parents_mating: 3
  solutions_per_population: 6
  keep_parents: 2
  gene_type: float
  init_range_low: -0.0001
  init_range_high: 1.5
  parent_selection_type: rank
  crossover_type: single_point
  crossover_probability: 0.75
  mutation_type: random
  mutation_by_replacement: true
  random_mutation_min_val: 1.5
  random_mutation_max_val: 0.67
  mutation_percent_genes: 10
  save_solutions: true
  save_best_solutions: true
  suppress_warnings: true
  previous_population_weight: 0.9
  random_population_weight: 0.1
  num_genes:
    multi_object_detection: 9
    semantic_segmentation: 7
    salient_object_detection: 9

image_fusion:
  ssim_window_size: 11
  h5_training:
    # data_path: datasets/MSRS/MSRS_train_imgsize_128_stride_200.h5
    batch_size: 4
    shuffle: true
    num_workers: 0
    train_every_n_batches: 1
  optimizer:
    weight_decay: 0.0
  gradient_clipping:
    max_norm: 0.01
    norm_type: 2

multi_object_detection:
  evolution_batch_size: 4
  dataset_yaml_directory: dataconfig
  hyperparameter_file: hyp.scratch-high.yaml
  model_config: models/detect/v8det.yaml
  checkpoint_map_location: cuda
  minimum_grid_size: 32
  single_class: false
  dataloader:
    augment: true
    cache: null
    rect: false
    workers: 2
    image_weights: false
    close_mosaic: false
    quad: false
    shuffle: false
    min_items: 0
  optimizer:
    weight_decay: 0.0
  train_every_n_batches: 1
  fused_image_padding: [0, 0, 64, 64]
  fused_image_padding_value: 0.45
  base_training:
    initial_model: yolov8s.yaml
    data_template: "{dataset}.yaml"
    batch_size: 32
    epochs: 300
    image_size: 512
    close_mosaic: 0
    patience: 300
    workers: 8
    device: 1
    seed: 26
  validation:
    batch_size: 1
    split: val
    plots: false
    save: false
    workers: 0
    project: ./rubbish
    mode: val
    name: val0
    map_weight: 0.7
    map50_weight: 0.3
    score_scale: 100.0

semantic_segmentation:
  evolution_batch_size: 2
  dataset:
    split: train
    stage: train
    aug: false
    resize_range: false
    rescale_range: false
    crop_size: false
    horizontal_flip: true
    ignore_index: 255
    default_num_classes: 9
    num_classes_by_dataset:
      FMB: 15
  dataloader:
    shuffle: false
    num_workers: 2
    pin_memory: true
    drop_last: true
    prefetch_factor: 4
  model:
    backbone: mit_b0
    embedding_dim: 256
    pretrained: true
  optimizer:
    fusion_weight_decay: 0.0
    backbone_group_0_weight_decay: 0.01
    backbone_group_1_weight_decay: 0.0
    backbone_group_2_lr_multiplier: 10.0
    backbone_group_2_weight_decay: 0.01
    weight_decay: 0.01
    betas: [0.9, 0.999]
    warmup_iterations: 20000
    max_iterations: 40000
    warmup_ratio: 1.0e-6
    power: 1.0
  train_every_n_batches: 1
  base_training:
    config_template: configs/segformer/segformer_{dataset}.py
  validation:
    miou_weight: 0.7
    mean_accuracy_weight: 0.3

salient_object_detection:
  evolution_batch_size: 4
  train_size: 480
  shuffle: true
  split: train
  optimizer:
    weight_decay: 0.0
  train_every_n_batches: 1
  infrared_grayscale_weights: [0.299, 0.587, 0.114]
  loss_weights:
    coarse: 1.0
    final: 1.0
    specific: 1.0
    auxiliary: 1.0
